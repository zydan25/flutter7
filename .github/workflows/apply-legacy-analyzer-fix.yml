name: Apply Legacy Analyzer Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact type fixes
        working-directory: ./shopik_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/reference_store_legacy.dart')
          text = path.read_text(encoding='utf-8')

          old_price = "    final currentPrice = salePrice ?? price;"
          new_price = "    final double currentPrice = (salePrice ?? price).toDouble();"

          old_items = """    final items = d['items'] is List ? (d['items'] as List).whereType<Map>().toList() : [];"""
          new_items = """    final List<Map<dynamic, dynamic>> items = d['items'] is List\n        ? (d['items'] as List)\n            .whereType<Map>()\n            .map<Map<dynamic, dynamic>>((item) => Map<dynamic, dynamic>.from(item))\n            .toList()\n        : <Map<dynamic, dynamic>>[];"""

          if old_price not in text:
              raise SystemExit('Expected currentPrice line was not found; refusing to modify.')
          if old_items not in text:
              raise SystemExit('Expected items line was not found; refusing to modify.')

          text = text.replace(old_price, new_price, 1)
          text = text.replace(old_items, new_items, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shopik_flutter/lib/screens/reference_store_legacy.dart
          git rm .github/workflows/apply-legacy-analyzer-fix.yml
          git commit -m "fix: resolve legacy store analyzer type errors"
          git push origin HEAD:main
